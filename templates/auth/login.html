<!DOCTYPE html>
<html>
    <head>
        <meta charset='utf-8'>
        <meta http-equiv='X-UA-Compatible' content='IE=edge'>
        <title>Login</title>
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
        <div class="login">
            <form name="login" method="post" action="">
                <div class="mb-4">
                    <label for="email">Email</label>
                    <input type="email" id="mail" name="mail" required class="input" placeholder="Inserisci la tua mail">
                </div>
                <div class="mb-6">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" required class="input" placeholder="Inserisci la tua password">
                </div>
                <button type="submit" class="login-U">Login</button>
            </form>
        </div>
    </body>
</html>
