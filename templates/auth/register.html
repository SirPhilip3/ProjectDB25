<!DOCTYPE html>
<html>
    <head>
        <meta charset='utf-8'>
        <meta http-equiv='X-UA-Compatible' content='IE=edge'>
        <title>Register</title>
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="/static/css/styles.css">
        <link rel="stylesheet" href="/static/css/login.css">
        <link rel="icon" href="/static/svg/color-filter.svg" type="image/x-icon">
    </head>
    <body>
        <div class="login">
            <form name="ragistration" method="post">
                <div class="mb-4">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" class="input" required placeholder="Inserisci la tua email">
                </div>
                <div class="mb-6">
                    <label for="username">Username</label>
                    <input id="username" type="username" name="username" class="input" required placeholder="Inserisci il tuo username">
                </div>
                <div class="mb-8">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" class="input" required placeholder="Inserisci la tua password">
                </div>
                <button type="submit" class="login-U">Register as User</button>
                <!-- <button type="submit" class="login-A">Register as Advertizer</button> -->
            </form>
        </div>
    </body>
</html>
