<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='static/style.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="auth-card fade-in-up">
                    <div class="auth-header">
                        <h2><i class="fas fa-plane-departure"></i> Flight Finder</h2>
                        <p class="mb-0">Create your account</p>
                    </div>
                    <div class="p-4">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="POST">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number (Optional)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                    <input type="phone" class="form-control" id="phone" name="phone">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Address (Optional)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-location-dot"></i></span>
                                    <input type="address" class="form-control" id="address" name="address">
                                </div>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="role" name="role" value="true">
                                <label class="form-check-label" for="role">
                                    <i class="fas fa-building"></i> I am an airline
                                </label>
                            </div>

                            <!-- Nome e congnome se ci si vuole registrare come normale utente -->
                            <div id="user-fields" style="display: block;">
                                <div class="mb-3" id="firstname-field">
                                    <label for="firstname" class="form-label">First name (Optional)</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                                        <input type="text" class="form-control" id="firstname" name="firstname" placeholder="Enter your first name">
                                    </div>
                                </div>
                                <div class="mb-3" id="lastname-field">
                                    <label for="lastname" class="form-label">Last name (Optional)</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                                        <input type="text" class="form-control" id="lastname" name="lastname" placeholder="Enter your last name">
                                    </div>
                                </div>
                            </div>

                            <!-- Nome della compagnia se ci si vuole registrare come Airline -->
                            <div class="mb-3" id="airline-field" style="display: none;">
                                <label for="airline_name" class="form-label">Airline Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-plane-departure"></i></span>
                                    <input type="text" class="form-control" id="airline_name" name="airline_name" placeholder="Enter airline name">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 mb-3 pulse-hover">
                                <i class="fas fa-user-plus"></i> Register
                            </button>
                        </form>
                        <div class="text-center">
                            <p class="mb-0">Already have an account? 
                                <a href="{{ url_for('login') }}" class="text-decoration-none">Sign in here</a>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <a href="{{ url_for('hello_world') }}" class="text-decoration-none">
                        <i class="fas fa-arrow-left"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('role').addEventListener('change', function() {
        const airlineField = document.getElementById('airline-field');
        const userFields = document.getElementById('user-fields');
        airlineField.style.display = this.checked ? 'block' : 'none';
        userFields.style.display = !this.checked ? 'block' : 'none';
    });
</script>
</body>
</html>
