<!DOCTYPE html>
<html>
    <head>
        <meta charset='utf-8'>
        <meta http-equiv='X-UA-Compatible' content='IE=edge'>
        <title>Register</title>
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
        <div class="login">
            <form name="ragistration" method="post">
                <div class="mb-4">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" class="input" required placeholder="Inserisci la tua email">
                </div>
                <div class="mb-8">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" class="input" required placeholder="Inserisci la tua password">
                </div>
                <div>
                    <input type="checkbox" id="role" name="role" value="true">
                    <label for="role">I am an airline</label><br>
                </div>
                <div id="airline-field" style="display: none;">
                    <label for="airline_name">Airline Name</label>
                    <input type="text" id="airline_name" name="airline_name" class="input" placeholder="Enter airline name">
                </div>
                <button type="submit" class="login-U">Register</button>
            </form>
        </div>
    </body>
</html>
<!-- js per far comparire il campo airline name se tick su I am an airline -->
<script>
document.getElementById('role').addEventListener('change', function() {
    const airlineField = document.getElementById('airline-field');
    if (this.checked) {
        airlineField.style.display = 'block';
    } else {
        airlineField.style.display = 'none';
    }
});
</script>
