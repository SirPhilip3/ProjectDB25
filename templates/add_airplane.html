<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Airplane - SkyLine Airways</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='static/style.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="auth-card fade-in-up">
          <div class="auth-header">
            <h3><i class="fas fa-jet-fighter"></i> Add New Airplane</h3>
            <p class="mb-0">Fill in the details below</p>
          </div>
          <div class="p-4">
            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="post">
              <div class="mb-3">
                <label for="model" class="form-label">Model</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-plane"></i></span>
                  <input type="text" class="form-control" id="model" name="model" placeholder="Boeing 737-800" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="capacity" class="form-label">Total Seats (auto-calculated)</label>
                <input type="number" class="form-control" id="capacity" name="capacity" readonly>
              </div>

              <div class="mb-3">
                <label for="seats_economy" class="form-label">Economy Seats</label>
                <input type="number" class="form-control" id="seats_economy" name="seats_economy" min="0" value="0" onchange="updateCapacity()" required>
              </div>

              <div class="mb-3">
                <label for="seats_business" class="form-label">Business Seats</label>
                <input type="number" class="form-control" id="seats_business" name="seats_business" min="0" value="0" onchange="updateCapacity()" required>
              </div>

              <div class="mb-3">
                <label for="seats_first" class="form-label">First Class Seats</label>
                <input type="number" class="form-control" id="seats_first" name="seats_first" min="0" value="0" onchange="updateCapacity()" required>
              </div>

              <div class="d-flex justify-content-between">
                <a href="{{ url_for('airline_profile', airline_id=current_user.airline_profile.id) }}" class="btn btn-outline-secondary">
                  <i class="fas fa-times"></i> Cancel
                </a>
                <button type="submit" class="btn btn-success">
                  <i class="fas fa-check"></i> Add Airplane
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  function updateCapacity() {
    const economy = parseInt(document.getElementById('seats_economy').value)  || 0;
    const business = parseInt(document.getElementById('seats_business').value) ||  0;
    const first = parseInt(document.getElementById('seats_first').value) || 0;
    const total = economy + business + first;
    document.getElementById('capacity').value = total;
  }
  updateCapacity();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
