<!DOCTYPE html>
<html>
    <head>
        <meta charset='utf-8'>
        <meta http-equiv='X-UA-Compatible' content='IE=edge'>
        <title>Add a new Airplane</title>
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
        <form method="post">
            <label>Modello: <input type="text" name="model"></label><br>
            <label>Posti totali: <input type="number" name="capacity"></label><br>
            <label>Posti Economy: <input type="number" name="seats_economy"></label><br>
            <label>Posti Business: <input type="number" name="seats_business"></label><br>
            <label>Posti First Class: <input type="number" name="seats_first"></label><br>
            <br><br>
            <button type="submit"> Add Airplane </button><br>
        </form>
        <a href="{{ url_for('airline_profile') }}"> Annulla </a>
    </body>
</html>
