<html>
<head>
  <title>Add Flight</title>
  
          <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <form method="post">
    <!-- <label>From: 
      <input type="text" name="name_from" required placeholder="Airport Name">
      <input type="text" name="city_from" required placeholder="Airport City">
      <input type="text" name="iata_from" required placeholder="Airport IATA-Code">
    </label><br>
    <label>To: 
      <input type="text" name="name_to" required placeholder="Airport Name">
      <input type="text" name="city_to" required placeholder="Airport City">
      <input type="text" name="iata_to" required placeholder="Airport IATA-Code">
    </label><br> -->
    <label>From: <input type="text" name="from" required></label><br>
    <label>To: <input type="text" name="to" required></label><br>
    <label>Data e Orario Partenza (UCT): <input type="datetime-local" name="departure_time" required></label><br>
    <label>Data e Orario Arrivo (UCT): <input type="datetime-local" name="arrival_time" required></label><br>
    
    <h4>Aereo assegnato</h4>
    <select name="airplane_id" id="airplane-select" onchange="updateAirplaneInfo()" required>
      <option value="">Seleziona un aereo</option>
      {% for airplane in airplanes %}
        <option value="{{ airplane.id }}" 
                data-economy="{{ airplane.economy_seats }}" 
                data-business="{{ airplane.business_seats }}" 
                data-first="{{ airplane.first_class_seats }}"
                data-capacity="{{ airplane.capacity }}">{{ airplane.model }}</option>
      {% endfor %}
    </select>

    <div id="airplane-info" style="display: none;">
      <h4>Posti Disponibili</h4>
      <p>Economy: <strong id="economy-seats">-</strong> posti</p>
      <p>Business: <strong id="business-seats">-</strong> posti</p>
      <p>First Class: <strong id="first-seats">-</strong> posti</p>
      <p><strong>Totale: <span id="total-seats">-</span> posti</strong></p>
    </div>

    <h4>Costo Posti</h4>
    <label>Economy: <input type="number" name="price_economy" required></label><br>
    <label>Business: <input type="number" name="price_business" required></label><br>
    <label>First: <input type="number" name="price_first" required></label><br>

    <h4>Extra</h4>
    <div id="extra-fields">
      <input type="text" name="extra_name_1" placeholder="Extra Name">
      <input type="number" name="extra_price_1" placeholder="Extra Price">
    </div>
    <button type="button" onclick="addExtra()">Add New Extra</button>
    

    <br><br>
    <button type="submit">Add</button>
  </form>
  <a href="{{ url_for('airline_profile', airline_id=current_user.airline_profile.id) }}"> Annulla </a>


   <!-- DA TESTARE  -->
  <script>

    function updateAirplaneInfo() {
      const select = document.getElementById('airplane-select');
      const selectedOption = select.options[select.selectedIndex];
      const infoDiv = document.getElementById('airplane-info');
      
      if (selectedOption.value === '') {
        infoDiv.style.display = 'none';
        return;
      }
      
      // Ottieni i dati dall'option selezionata
      const economySeats = selectedOption.getAttribute('data-economy');
      const businessSeats = selectedOption.getAttribute('data-business');
      const firstSeats = selectedOption.getAttribute('data-first');
      const capacity = selectedOption.getAttribute('data-capacity');
      
      // Aggiorna le informazioni (solo visualizzazione)
      document.getElementById('economy-seats').textContent = economySeats;
      document.getElementById('business-seats').textContent = businessSeats;
      document.getElementById('first-seats').textContent = firstSeats;
      document.getElementById('total-seats').textContent = capacity;
      
      // Mostra il div informazioni
      infoDiv.style.display = 'block';
    }

    let extraCount = 1;
    function addExtra() {
      extraCount++;
      const div = document.getElementById('extra-fields');
      const html = `
        <br>
        <input type="text" name="extra_name_${extraCount}" placeholder="Extra Name">
        <input type="number" name="extra_price_${extraCount}" placeholder="Extra Price">
      `;
      div.insertAdjacentHTML('beforeend', html);
    }
  </script>
</body>
</html>
